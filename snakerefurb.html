<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snake game</title>
    <link rel="stylesheet" href="snake.css">
</head>
<body>
    <h1>SNAKE GAME</h1>
    <div class="scoreboard">
        <span>score: <b id="score">0</b></span>
        <span>High Score: <b id="high">0</b></span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <p class="hint">Use Arrow Keys to Move</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let box = 20;
        let snake = [{x: 10, y: 10}];
        let dir = 'RIGHT';
        let food = randomFood();
        let score = 0;
        let highScore = localStorage.getItem('snakehigh') || 0;
        
        document.getElementById('high').innerText = highScore;

        // Listen for arrow key presses
        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const key = event.keyCode;
            if (key === 37 && dir !== 'RIGHT') dir = 'LEFT';
            else if (key === 38 && dir !== 'DOWN') dir = 'UP';
            else if (key === 39 && dir !== 'LEFT') dir = 'RIGHT';
            else if (key === 40 && dir !== 'UP') dir = 'DOWN';
        }

        function randomFood() {
            return {
                x: Math.floor(Math.random() * 20),
                y: Math.floor(Math.random() * 20)
            };
        }

        // Check if snake hits itself
        function checkCollision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Main game logic loop
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000'; // Or your background color
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? 'green' : 'lime';
                ctx.fillRect(snake[i].x * box, snake[i].y * box, box - 2, box - 2);
            }

            // Draw Food
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * box, food.y * box, box - 2, box - 2);

            // Get current head position
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Move head based on direction
            if (dir === 'LEFT') snakeX--;
            if (dir === 'UP') snakeY--;
            if (dir === 'RIGHT') snakeX++;
            if (dir === 'DOWN') snakeY++;

            // Create new head
            let newHead = { x: snakeX, y: snakeY };

            // Game Over conditions (Wall or Self Collision)
            if (snakeX < 0 || snakeX >= 20 || snakeY < 0 || snakeY >= 20 || checkCollision(newHead, snake)) {
                clearInterval(game);
                alert(`Game Over! Score: ${score}`);
                // Update high score
                if (score > highScore) {
                    localStorage.setItem('snakehigh', score);
                }
                location.reload(); // Restart game
                return;
            }

            // Check if snake eats the food
            if (snakeX === food.x && snakeY === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                food = randomFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            // Add new head to snake
            snake.unshift(newHead);
        }

        // Run the game every 100 milliseconds
        let game = setInterval(draw, 100);
    </script>
</body>
</html>
